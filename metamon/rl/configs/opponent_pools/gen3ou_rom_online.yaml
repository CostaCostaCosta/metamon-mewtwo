# Gen 3 OU opponent pool for the gen3_rom_online_v0 online RL run (goal task 2).
#
# League design:
#   * the run's own LATEST policy (self-play vs the rolling latest/policy.pt),
#   * 1 deployment of pretrained SyntheticRLV2 (fixed strong external reference),
#   * 3 deployments of pretrained Kakuna at varying temperature (a strong gen3
#     policy: ~63% GXE vs humans on competitive gen3ou; temps add diversity),
#   * 4 PSRO FIFO slots for THIS run's past checkpoints once they outperform
#     SyntheticRLV2 (val WR vs SyntheticRLV2 >= 0.50). Slots start empty and are
#     filled first-in-first-out by the monitor (~/metamon_runs/monitor_gen3/).
#
# All battles draw teams from mrv2_smogtours_hilo (the gen3 online team set) so
# learner and opponents see matched team compositions.
#
# NOTE on weights: rows are uniform until PSRO-Lite (--psro_weighting) writes the
# meta_weights.json sidecar at --psro_start_epoch; the sidecar then reweights rows
# by the learner's empirical win rate per agent.
defaults:
  team_set: mrv2_smogtours_hilo
  battle_backend: metamon
  checkpoints: [null]
  temperatures: [1.0]
  num_agents: 1

agents:
  # --- latest policy (self-play peer) ---
  Gen3RomOnlineV0:
    model_name: Gen3RomOnlineV0
    num_agents: 2            # self-play is the primary peer
    checkpoints: [-1]        # LATEST_CHECKPOINT: learner's rolling latest/policy.pt
    temperatures: [1.0]

  # --- SyntheticRLV2 x1 (fixed strong external reference) ---
  SyntheticRLV2:
    model_name: SyntheticRLV2
    checkpoints: [48]        # default/best checkpoint
    temperatures: [1.0]

  # --- Kakuna x3 at varying temperature (strong gen3 policy, diverse) ---
  Kakuna_t08:
    model_name: Kakuna
    checkpoints: [34]        # default/best checkpoint
    temperatures: [0.8]
  Kakuna_t12:
    model_name: Kakuna
    checkpoints: [34]
    temperatures: [1.2]
  Kakuna_t16:
    model_name: Kakuna
    checkpoints: [34]
    temperatures: [1.6]

  # --- 4 PSRO FIFO slots (EMPTY at launch; filled by the monitor) ---
  # When the current policy's val WR vs SyntheticRLV2 crosses 0.50 (and at later
  # new highs), the monitor inserts a row below, e.g.:
  #   Gen3RomOnlineV0_e120:
  #     model_name: Gen3RomOnlineV0
  #     checkpoints: [120]
  #     temperatures: [1.0]
  # Cap 4 rows; when full, the OLDEST row is evicted (first-in, first-out).
  # (Left commented so the pool loads with only the 6 live agents until the
  # first trigger fires.)
